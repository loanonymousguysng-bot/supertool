name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build EXE
        run: python -m PyInstaller --onefile --noconsole --name SchoolAIDraftHelper launcher.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SchoolAIDraftHelper-Windows
          path: dist/SchoolAIDraftHelper.exe
